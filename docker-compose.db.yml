version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suna_postgres
    environment:
      POSTGRES_DB: suna
      POSTGRES_USER: suna_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suna_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5491}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suna_user -d suna"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - suna_network

  redis:
    image: redis:7-alpine
    container_name: suna_redis
    ports:
      - "${REDIS_PORT:-6391}:6379"
    volumes:
      - redis_data:/data
      - ./database/config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - suna_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  suna_network:
    driver: bridge