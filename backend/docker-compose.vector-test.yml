version: '3.8'

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: suna_vector_test
      POSTGRES_USER: suna_user
      POSTGRES_PASSWORD: suna_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suna_user -d suna_vector_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-vector:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_vector_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_vector_data:
  redis_vector_data: