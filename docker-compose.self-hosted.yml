version: '3.8'

services:
  # Database Layer
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: suna
      POSTGRES_USER: suna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suna_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./backend/database/migrations:/migrations:ro
    ports:
      - "127.0.0.1:18881:5432"
    networks:
      - suna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suna -d suna"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100

  redis:
    image: redis:8-alpine
    container_name: suna-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:18882:6379"
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Layer
  backend:
    container_name: suna-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://suna:${POSTGRES_PASSWORD:-suna_password}@postgres:5432/suna
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@suna.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_password_change_this}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-18886}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:18884", "http://127.0.0.1:18884", "http://suna.local:18884"]
    volumes:
      - backend_logs:/app/logs
      - ./backend/.env:/app/.env:ro
    ports:
      - "127.0.0.1:18883:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    container_name: suna-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run dramatiq --processes 4 --threads 4 run_agent_background
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://suna:${POSTGRES_PASSWORD:-suna_password}@postgres:5432/suna
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this}
      - LOG_LEVEL=INFO
    volumes:
      - worker_logs:/app/logs
      - ./backend/.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "uv", "run", "worker_health.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  frontend:
    container_name: suna-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_SUPABASE_URL=http://backend:8000
    ports:
      - "127.0.0.1:18884:3001"
    depends_on:
      - backend
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # AI/ML Services
  ollama:
    image: ollama/ollama:latest
    container_name: suna-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_MAX_QUEUE=512
      - OLLAMA_RUNNERS_DIR=/tmp/ollama-runners
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:18885:11434"
    networks:
      - suna-network
    profiles:
      - ollama-docker
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Supporting Services
  mailhog:
    image: mailhog/mailhog:latest
    container_name: suna-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:18886:1025"  # SMTP server
      - "127.0.0.1:18887:8025"  # Web interface
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring and Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: suna-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=200h
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:18888:9090"
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: suna-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:18889:3002"
    depends_on:
      - prometheus
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Balancer (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: suna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Sandbox Container Management
  sandbox-manager:
    image: docker:dind
    container_name: suna-sandbox-manager
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - sandbox_data:/var/lib/docker
      - ./sandbox/docker-compose.yml:/sandbox/docker-compose.yml:ro
    networks:
      - suna-network
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  suna-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  backend_logs:
    driver: local
  worker_logs:
    driver: local
  nginx_logs:
    driver: local
  sandbox_data:
    driver: local

