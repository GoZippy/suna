version: '3.8'

services:
  # Database Layer
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suna-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: suna_dev
      POSTGRES_USER: suna_user
      POSTGRES_PASSWORD: suna_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5491:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suna_user -d suna_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: suna-redis-dev
    ports:
      - "6391:6379"
    volumes:
      - redis_data_dev:/data
      - ./database/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Application Layer
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suna-backend-dev
    environment:
      - DATABASE_URL=postgresql://suna_user:suna_password@postgres:5432/suna_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - LOCAL_STORAGE_PATH=/app/data/storage
      - ENV_MODE=local
      - SMTP_HOST=mailhog
      - SMTP_PORT=1091
      - SMTP_USE_TLS=false
      - SENDER_EMAIL=noreply@suna.local
      - SENDER_NAME=Suna System
      - ENABLE_LOCAL_EMAIL=true
      - ENABLE_EMAIL_QUEUE=true
      - ENABLE_EMAIL_NOTIFICATIONS=true
      - REDIS_BROKER_HOST=redis
      - REDIS_BROKER_PORT=6391
      - REDIS_BROKER_SSL=false
      - WORKER_PROCESSES=4
      - WORKER_THREADS=4
      - ENABLE_BACKGROUND_JOBS=true
      - ENABLE_JOB_SCHEDULING=true
      - ENABLE_JOB_MONITORING=true
      - ENABLE_WORKER_SCALING=true
      - ENABLE_JOB_PERSISTENCE=true
      - ENABLE_WEBSOCKET=true
      - ENABLE_FILE_STORAGE=true
      - ENABLE_MONITORING=true
      - ENABLE_METRICS_COLLECTION=true
      - ENABLE_HEALTH_CHECKS=true
      - ENABLE_ALERTING=true
      - ENABLE_AUDIT_LOGGING=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8091:8000"
    volumes:
      - ./backend:/app
      - storage_data_dev:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python -c 'import asyncio; from database.connection import db_manager; asyncio.run(db_manager.initialize())' &&
        echo 'Starting backend server...' &&
        uvicorn api:app --host 0.0.0.0 --port 8000 --reload
      "

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suna-worker-dev
    environment:
      - DATABASE_URL=postgresql://suna_user:suna_password@postgres:5432/suna_dev
      - REDIS_URL=redis://redis:6391
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - LOCAL_STORAGE_PATH=/app/data/storage
      - ENV_MODE=local
      - REDIS_BROKER_HOST=redis
      - REDIS_BROKER_PORT=6391
      - REDIS_BROKER_SSL=false
      - WORKER_PROCESSES=4
      - WORKER_THREADS=4
      - ENABLE_BACKGROUND_JOBS=true
      - ENABLE_JOB_SCHEDULING=true
      - ENABLE_JOB_MONITORING=true
      - ENABLE_WORKER_SCALING=true
      - ENABLE_JOB_PERSISTENCE=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - storage_data_dev:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python -c 'import asyncio; from database.connection import db_manager; asyncio.run(db_manager.initialize())' &&
        echo 'Starting background job workers...' &&
        uv run dramatiq --processes 4 --threads 4 run_agent_background
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suna-frontend-dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8091
      - NEXT_PUBLIC_WS_URL=ws://localhost:8091
    ports:
      - "3091:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # AI/ML Services
  ollama:
    image: ollama/ollama:latest
    container_name: suna-ollama-dev
    ports:
      - "11491:11434"
    volumes:
      - ollama_data_dev:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  # Supporting Services
  mailhog:
    image: mailhog/mailhog:latest
    container_name: suna-mailhog-dev
    ports:
      - "1091:1025"  # SMTP port
      - "8091:8025"  # Web UI port
    restart: unless-stopped

  # Monitoring and Observability (Development)
  prometheus:
    image: prom/prometheus:latest
    container_name: suna-prometheus-dev
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=200h
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data_dev:/prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: suna-grafana-dev
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3191:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  storage_data_dev:
    driver: local
  ollama_data_dev:
    driver: local
  prometheus_data_dev:
    driver: local
  grafana_data_dev:
    driver: local

networks:
  default:
    name: suna_network_dev
