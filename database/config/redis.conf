# Redis Configuration for Suna Self-Hosted

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Security
# requirepass your_redis_password_here  # Uncomment and set in production

# Performance
tcp-backlog 511
databases 16
hz 10