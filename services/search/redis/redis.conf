# Redis configuration for search service caching

# Basic settings
port 6379
bind 0.0.0.0
protected-mode no
timeout 300
tcp-keepalive 300

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (disabled for cache-only usage)
save ""
appendonly no

# Logging
loglevel notice
logfile ""

# Performance
tcp-backlog 511
databases 16

# Security
requirepass ""

# Cache-specific settings
# Expire keys after 1 hour by default
# This will be overridden by application-specific TTLs