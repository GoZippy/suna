version: '3.8'

services:
  # Redis for caching search results
  redis:
    image: redis:7-alpine
    container_name: suna_search_redis
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Simple web scraping service (no Playwright)
  simple-scraping:
    build:
      context: ./simple-scraping
      dockerfile: Dockerfile
    container_name: suna_simple_scraping
    ports:
      - "8082:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MAX_CONCURRENT_REQUESTS=10
      - REQUEST_TIMEOUT=30
      - CACHE_TTL=3600
    volumes:
      - ./simple-scraping:/app
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: suna_search_network