# SearXNG configuration for Suna local search
use_default_settings: true

general:
  debug: false
  instance_name: "Suna Local Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

brand:
  new_issue_url: ""
  docs_url: ""
  public_instances: ""
  wiki_url: ""
  issue_url: ""

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "change-this-secret-key-in-production"
  base_url: false
  image_proxy: false
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  cache_url: "https://web.archive.org/web/"
  search_on_category_select: true
  hotkeys: default

# Enable key search engines
engines:
  - name: google
    engine: google
    shortcut: go
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: bi

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: startpage
    engine: startpage
    shortcut: sp

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: 'https://{language}.wikipedia.org/'

  - name: github
    engine: github
    shortcut: gh

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so

  - name: reddit
    engine: reddit
    shortcut: re

# Disable engines we don't need
disabled_engines:
  - ahmia
  - arch linux wiki
  - artic
  - base
  - bitbucket
  - btdigg
  - currency
  - deezer
  - deviantart
  - digbt
  - erowid
  - flickr
  - fdroid
  - frinkiac
  - genius
  - gigablast
  - gitlab
  - google images
  - google news
  - google scholar
  - google videos
  - hackernews
  - imdb
  - imgur
  - invidious
  - library genesis
  - lobste.rs
  - mdn
  - mixcloud
  - nyaa
  - openstreetmap
  - pdbe
  - photon
  - piratebay
  - pubmed
  - qwant
  - qwant images
  - qwant news
  - reddit
  - sepiasearch
  - soundcloud
  - stackoverflow
  - startpage
  - tokyotoshokan
  - twitter
  - unsplash
  - yahoo
  - yahoo news
  - yandex
  - youtube
  - z-library

# Rate limiting and caching
redis:
  url: redis://redis:6379/0

limiter: true
botdetection:
  ip_limit:
    filter_link_local: true
    link_token: true