version: '3.8'

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: suna_postgres
    environment:
      POSTGRES_DB: suna
      POSTGRES_USER: suna_user
      POSTGRES_PASSWORD: suna_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5491:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suna_user -d suna"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    container_name: suna_redis
    ports:
      - "6391:6379"
    volumes:
      - redis_data:/data
      - ./database/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Suna backend application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suna_backend
    environment:
      - DATABASE_URL=postgresql://suna_user:suna_password@postgres:5432/suna
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - LOCAL_STORAGE_PATH=/app/data/storage
      - ENV_MODE=local
      - SMTP_HOST=mailhog
      - SMTP_PORT=1091
      - SMTP_USE_TLS=false
      - SENDER_EMAIL=noreply@suna.local
      - SENDER_NAME=Suna System
      - ENABLE_LOCAL_EMAIL=true
      - ENABLE_EMAIL_QUEUE=true
      - ENABLE_EMAIL_NOTIFICATIONS=true
      - REDIS_BROKER_HOST=redis
      - REDIS_BROKER_PORT=6391
      - REDIS_BROKER_SSL=false
      - WORKER_PROCESSES=4
      - WORKER_THREADS=4
      - ENABLE_BACKGROUND_JOBS=true
      - ENABLE_JOB_SCHEDULING=true
      - ENABLE_JOB_MONITORING=true
      - ENABLE_WORKER_SCALING=true
      - ENABLE_JOB_PERSISTENCE=true
    ports:
      - "8091:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python -c 'import asyncio; from database.connection import db_manager; asyncio.run(db_manager.initialize())' &&
        echo 'Starting backend server...' &&
        uvicorn api:app --host 0.0.0.0 --port 8000 --reload
      "

  # Background job workers
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suna_worker
    environment:
      - DATABASE_URL=postgresql://suna_user:suna_password@postgres:5432/suna
      - REDIS_URL=redis://redis:6391
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - LOCAL_STORAGE_PATH=/app/data/storage
      - ENV_MODE=local
      - REDIS_BROKER_HOST=redis
      - REDIS_BROKER_PORT=6391
      - REDIS_BROKER_SSL=false
      - WORKER_PROCESSES=4
      - WORKER_THREADS=4
      - ENABLE_BACKGROUND_JOBS=true
      - ENABLE_JOB_SCHEDULING=true
      - ENABLE_JOB_MONITORING=true
      - ENABLE_WORKER_SCALING=true
      - ENABLE_JOB_PERSISTENCE=true
    volumes:
      - ./backend:/app
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        python -c 'import asyncio; from database.connection import db_manager; asyncio.run(db_manager.initialize())' &&
        echo 'Starting background job workers...' &&
        uv run dramatiq --processes 4 --threads 4 run_agent_background
      "

  # Suna frontend application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suna_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8091
      - NEXT_PUBLIC_WS_URL=ws://localhost:8091
    ports:
      - "3091:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Ollama for local LLM inference (optional)
  ollama:
    image: ollama/ollama:latest
    container_name: suna_ollama
    ports:
      - "11491:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    # Uncomment the following lines if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # MailHog for local email testing and development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: suna_mailhog
    ports:
      - "1091:1025"  # SMTP port
      - "8091:8025"  # Web UI port
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  ollama_data:
    driver: local

networks:
  default:
    name: suna_network