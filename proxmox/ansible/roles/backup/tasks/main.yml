- name: Create backup rollback script
  template:
    src: backup-rollback.sh.j2
    dest: "{{ suna_home }}/scripts/backup-rollback.sh"
    owner: "{{ suna_user }}"
    group: "{{ suna_group }}"
    mode: '0755'

- name: Configure backup testing cron job
  cron:
    name: "Backup testing"
    hour: "6"
    minute: "0"
    job: "{{ suna_home }}/scripts/backup-test.sh"
    user: "{{ suna_user }}"
    when: inventory_hostname in groups['management']

- name: Create backup status monitoring
  template:
    src: backup-status.sh.j2
    dest: "{{ suna_home }}/scripts/backup-status.sh"
    owner: "{{ suna_user }}"
    group: "{{ suna_group }}"
