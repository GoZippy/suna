- name: Configure backup alerting
  template:
    src: backup-alerts.yml.j2
    dest: "{{ suna_home }}/config/backup-alerts.yml"
    owner: "{{ suna_user }}"
    group: "{{ suna_group }}"
    mode: '0644'







