---
- name: Update system packages
  apt:
    update_cache: yes
    upgrade: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - htop
      - vim
      - net-tools
      - ufw
      - fail2ban
      - logrotate
      - rsyslog
    state: present
  when: ansible_os_family == "Debian"

- name: Configure timezone
  timezone:
    name: UTC

- name: Configure NTP
  apt:
    name: ntp
    state: present
  when: ansible_os_family == "Debian"

- name: Start and enable NTP service
  systemd:
    name: ntp
    state: started
    enabled: yes

- name: Configure SSH security
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - regexp: "^#?PermitRootLogin"
      line: "PermitRootLogin no"
    - regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication no"
    - regexp: "^#?PubkeyAuthentication"
      line: "PubkeyAuthentication yes"
    - regexp: "^#?AuthorizedKeysFile"
      line: "AuthorizedKeysFile .ssh/authorized_keys"
    - regexp: "^#?Protocol"
      line: "Protocol 2"
  notify: restart ssh

- name: Configure firewall
  ufw:
    direction: "{{ item.direction }}"
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - direction: allow
      rule: allow
      port: ssh
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.frontend_http }}"
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.api_http }}"
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.postgres }}"
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.redis }}"
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.prometheus }}"
      proto: tcp
    - direction: allow
      rule: allow
      port: "{{ suna_ports.grafana }}"
      proto: tcp
  when: inventory_hostname in groups['application'] or inventory_hostname in groups['database'] or inventory_hostname in groups['redis'] or inventory_hostname in groups['monitoring']

- name: Enable firewall
  ufw:
    state: enabled
    policy: deny

- name: Configure fail2ban
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Configure logrotate for Suna logs
  template:
    src: suna-logrotate.j2
    dest: /etc/logrotate.d/suna
    owner: root
    group: root
    mode: '0644'

- name: Configure system limits
  template:
    src: limits.conf.j2
    dest: /etc/security/limits.conf
    owner: root
    group: root
    mode: '0644'

- name: Configure sysctl parameters
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - name: net.core.somaxconn
      value: '65535'
    - name: net.ipv4.tcp_max_syn_backlog
      value: '65535'
    - name: net.ipv4.ip_local_port_range
      value: '1024 65535'
    - name: vm.max_map_count
      value: '262144'
    - name: fs.file-max
      value: '2097152'

- name: Create Suna user and group
  user:
    name: "{{ suna_user }}"
    group: "{{ suna_group }}"
    system: yes
    shell: /bin/bash
    home: "{{ suna_home }}"
    create_home: yes
    groups: sudo
    append: yes

- name: Create Suna directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ suna_user }}"
    group: "{{ suna_group }}"
    mode: '0755'
  loop:
    - "{{ suna_home }}"
    - "{{ suna_data }}"
    - "{{ suna_logs }}"
    - "{{ suna_home }}/config"
    - "{{ suna_home }}/scripts"
    - "{{ suna_data }}/database"
    - "{{ suna_data }}/storage"
    - "{{ suna_data }}/backups"
    - "{{ suna_logs }}/application"
    - "{{ suna_logs }}/system"

- name: Configure sudoers for Suna user
  lineinfile:
    path: /etc/sudoers
    line: "{{ suna_user }} ALL=(ALL) NOPASSWD: ALL"
    state: present
    validate: 'visudo -cf %s'

- name: Set up SSH directory for Suna user
  file:
    path: "{{ suna_home }}/.ssh"
    state: directory
    owner: "{{ suna_user }}"
    group: "{{ suna_group }}"
    mode: '0700'

- name: Configure authorized keys for Suna user
  authorized_key:
    user: "{{ suna_user }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
  when: lookup('file', '~/.ssh/id_rsa.pub') is defined

- name: Configure systemd journal settings
  lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?SystemMaxUse="
    line: "SystemMaxUse=1G"
    state: present

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Configure hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ ansible_default_ipv4.address }} {{ inventory_hostname }}"
    state: present
    regexp: "{{ ansible_default_ipv4.address }}"







